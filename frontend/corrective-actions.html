<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corrective Actions — Coal Governance Platform</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/forms.css" />
<link rel="stylesheet" href="css/responsive.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="app-sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <h1>Corrective Actions Workflow</h1>
      <div class="topbar-user" id="topbar-user-info"></div>
    </header>

    <main class="content">
      <div class="toolbar">
        <select id="filter-status">
          <option value="">All Statuses</option>
          <option value="ASSIGNED">Assigned</option>
          <option value="SUBMITTED">Submitted</option>
          <option value="VERIFIED">Verified</option>
          <option value="CLOSED">Closed</option>
          <option value="OVERDUE">Overdue</option>
        </select>
        <button id="filter-my-tasks" class="btn btn-secondary">Show My Tasks Only</button>
        <div class="spacer"></div>
        <button id="run-escalation-btn" class="btn btn-warning hidden" style="display:inline-flex; align-items:center; gap:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Check Deadlines &amp; Escalations
        </button>
      </div>

      <div class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Violation</th>
              <th>Mine</th>
              <th>Action Description</th>
              <th>Assignee</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Escalation</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="actions-table-body">
            <tr><td colspan="8" class="state-panel">Loading corrective actions...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Verify Resolution Modal -->
<div class="modal-backdrop hidden" id="verify-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Verify Action Resolution</h3>
      <button class="modal-close" id="verify-close">&times;</button>
    </div>
    <form id="verify-form">
      <div class="modal-body">
        <input type="hidden" id="verify-action-id" />
        <div class="form-group">
          <div class="form-label-row">
            <label for="verify-remarks">Audit Feedback / Review Remarks</label>
            <button type="button" class="btn-desc-mic" data-target="verify-remarks" title="Speak to dictate in selected language">
              <span class="mic-icon" style="display:inline-flex; align-items:center;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></span> <span class="mic-status-text">Voice Input</span>
            </button>
          </div>
          <textarea id="verify-remarks" placeholder="Provide details on verification (e.g. site inspection completed, PPE compliance verified)..."></textarea>
        </div>
        <div class="form-group">
          <label for="verify-decision">Verification Outcome</label>
          <select id="verify-decision" required>
            <option value="APPROVE">Approve, Resolve &amp; Close Violation</option>
            <option value="REJECT">Reject, Return to Assigned State</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="verify-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="verify-save">Submit Verdict</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-root"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/auth.js"></script>
<script src="js/corrective-actions.js"></script>
<script src="js/pwa.js"></script>
<script src="js/voice-assistant.js"></script>
</body>
</html>
