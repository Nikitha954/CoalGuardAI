<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports — Coal Governance Platform</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/forms.css" />
<link rel="stylesheet" href="css/responsive.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="app-sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <h1>Reports Export</h1>
      <div class="topbar-user" id="topbar-user-info"></div>
    </header>

    <main class="content">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; align-items:start;">
        <div class="card">
          <div class="card-header">
            <h3>Generate Compliance &amp; Governance Reports</h3>
          </div>
          <form id="report-form" style="padding: 20px;">
            <div class="form-group">
              <label for="rep-type">Select Report Type</label>
              <select id="rep-type" required style="padding: 10px; font-size:14px;">
                <option value="VIOLATIONS">Violations Compliance Log</option>
                <option value="CORRECTIVE_ACTIONS">Corrective Actions Audits</option>
                <option value="HIGH_RISK_MINES">High &amp; Critical Risk Mine Profiles</option>
                <option value="ATTENDANCE">Workforce &amp; Attendance Compliance</option>
                <option value="ENVIRONMENTAL">Environmental &amp; CPCB Telemetry</option>
              </select>
            </div>

            <div class="form-group">
              <label for="rep-mine">Filter by Mine (Optional)</label>
              <select id="rep-mine" style="padding: 10px; font-size:14px;">
                <option value="">All Mines</option>
              </select>
            </div>

            <div class="form-group">
              <label for="rep-format">File Format</label>
              <select id="rep-format" required style="padding: 10px; font-size:14px;">
                <option value="PDF">Formal Document (PDF)</option>
                <option value="CSV">Excel Spreadsheet (CSV)</option>
              </select>
            </div>

            <div style="margin-top: 24px; border-top: 1px solid var(--color-border-light); padding-top: 16px; text-align: right;">
              <button type="submit" class="btn btn-primary" id="btn-generate" style="padding: 10px 24px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Generate &amp; Download
              </button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Statutory Generated Report Archive</h3>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Report Title</th>
                <th>Format</th>
                <th>Generated By</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="report-history-body">
              <tr><td colspan="4" class="state-panel">Loading archive...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-root"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/auth.js"></script>
<script src="js/reports.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
